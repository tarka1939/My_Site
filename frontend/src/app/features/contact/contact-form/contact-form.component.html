<h1>Contact</h1>

@if (submitted()) {
  <p role="status">Thanks for reaching out &mdash; I'll get back to you soon.</p>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="contact-name">Name</label>
      <input id="contact-name" type="text" formControlName="name" autocomplete="name" />
      @if (fieldErrors()['name']) {
        <p class="field-error" role="alert">{{ fieldErrors()['name'] }}</p>
      }
    </div>

    <div class="field">
      <label for="contact-email">Email</label>
      <input id="contact-email" type="email" formControlName="email" autocomplete="email" />
      @if (fieldErrors()['email']) {
        <p class="field-error" role="alert">{{ fieldErrors()['email'] }}</p>
      }
    </div>

    <div class="field">
      <label for="contact-message">Message</label>
      <textarea id="contact-message" rows="6" formControlName="message"></textarea>
      @if (fieldErrors()['message']) {
        <p class="field-error" role="alert">{{ fieldErrors()['message'] }}</p>
      }
    </div>

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Sending…' : 'Send message' }}
    </button>
  </form>
}
