<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Same string as og:title/twitter:title below, and as SITE_TITLE in core/seo/site-meta.ts:
         one name for this document, whether a consumer reads the title or the share tags. -->
    <title>Krzysztof Tarka — project portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      The two faces the first screen is actually set in, fetched in parallel with the stylesheet
      that will ask for them rather than after it (docs/DECISIONS.md, 2026-08-22 -- "preload only
      the face used above the fold"). Archivo draws the brand and the h1; IBM Plex Sans 400 draws
      every card. The other two files styles.scss declares -- Plex Sans 600 and Plex Mono -- are
      deliberately NOT here: preloading everything is the same as preloading nothing, since it
      just moves the contention rather than removing it, and both are metrically matched to a
      local fallback so their swap costs a repaint, not a reflow.

      `crossorigin` is mandatory even though these are same-origin: fonts are always fetched in
      CORS mode, so a preload without it is a second, unused request rather than a warmed cache.
      The paths are the ones styles.scss names, unhashed, because they are copied from public/ --
      if you rename a file there, rename it in both places or this silently becomes dead weight.
    -->
    <link
      rel="preload"
      href="/fonts/archivo-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      The API origin (#89). Every page's data comes from this cross-origin backend, and the preload
      scanner cannot discover it: nothing in this document references it, so the DNS lookup, TCP
      handshake and TLS negotiation only start once the bundle has loaded and Angular has issued its
      first request. Warming the connection here moves that entirely off the critical path. It is
      placed after the font preloads deliberately -- the faces are needed for first paint, this
      connection is not needed until after bootstrap, and a preconnect is a handshake rather than a
      byte transfer, so it costs little to sit behind them.

      `crossorigin` is required, and the Authorization header is not the reason. Browsers keep
      separate socket pools for anonymous and credentialed connections, and a preconnect without
      `crossorigin` warms the credentialed one. What decides which pool the real request uses is
      `withCredentials`, which nothing sets -- app.config.ts calls provideApi() with a bare base URL,
      so the generated client leaves Configuration.withCredentials undefined and every call goes out
      anonymous. `crossorigin` matches that pool; omitting it would warm a connection the API calls
      never touch. The bearer token authInterceptor attaches is an ordinary request header, not
      browser-managed credentials, so it does not change the pool either way. It does make every
      admin request non-simple and so preflighted -- which only sharpens this, since the OPTIONS
      preflight is then what pays for the handshake.

      dns-prefetch is a deliberate fallback, not a duplicate: browsers that support preconnect
      ignore it for an origin they are already connecting to, so it is a no-op in practice and earns
      its line only for anything that supports resolution hints but not preconnect. Keep this host
      in sync with apiBaseUrl in src/environments/environment.ts -- a stale origin here is silently
      useless, warming a connection nothing then uses. Note this file is not swapped per build
      configuration, so under `ng serve` (where apiBaseUrl is relative and proxied) this is one
      speculative handshake that goes unused; that is the accepted cost of not templating index.html.
    -->
    <link rel="preconnect" href="https://tarka1939.bieda.it" crossorigin />
    <link rel="dns-prefetch" href="https://tarka1939.bieda.it" />

    <!--
      Static SEO / sharing tags -- see the 2026-08-10 SEO ADR in docs/DECISIONS.md.

      This app is client-rendered, so these are the ONLY tags a non-JS crawler ever sees. Googlebot
      renders JS and picks up the per-route values that SeoService writes over these
      (src/app/core/seo/), but LinkedIn, Slack, Discord, X and Facebook do not execute JS: whatever
      is written below is exactly what a shared link previews as, on every route. So this set
      describes the *site*, not any one page.

      The name/property attributes here are the selectors SeoService updates through -- `property`
      for Open Graph (per the OGP spec), `name` for Twitter and description (per Twitter's docs).
      Renaming an attribute here without changing the service turns a runtime update into a second,
      duplicate tag. There is a test for that (seo.service.spec.ts).

      PLACEHOLDER: the origin below is deliberately unresolvable (.invalid, RFC 2606) because the
      canonical domain does not exist yet -- Phase 5 is paused and PROJECT_TODO.md says not to guess
      it. Replace it here, in public/robots.txt and in public/sitemap.xml when the Netlify origin is
      real. Until then og:url is a placeholder for scrapers; SeoService overwrites it at runtime
      with the actual location.

      READ BEFORE REPLACING IT: og:url is one site-level value, and a non-JS scraper sees it on
      every route, /projects/<id> included. Facebook and LinkedIn treat og:url as the shared
      object's identity -- they cache and count engagement against it, and the card links to it --
      so with a *real* origin here, two different project links collapse into one cached object for
      the root and the card's link target is the root, not the project. Harmless while the origin
      cannot resolve; a live decision the moment it can. Options are recorded in the 2026-08-10 SEO
      ADR in docs/DECISIONS.md, under "One further consequence".

      No og:image yet: there is no share image asset in public/, and pointing at a 404 makes a worse
      preview than none. twitter:card is "summary" rather than "summary_large_image" for the same
      reason -- the large-image card renders broken without an image.
    -->
    <meta
      name="description"
      content="A portfolio of software and audio/DSP projects — what each one does, how it was built, and where to find the code."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Krzysztof Tarka" />
    <meta property="og:title" content="Krzysztof Tarka — project portfolio" />
    <meta
      property="og:description"
      content="A portfolio of software and audio/DSP projects — what each one does, how it was built, and where to find the code."
    />
    <meta property="og:url" content="https://REPLACE-WITH-CANONICAL-ORIGIN.invalid/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Krzysztof Tarka — project portfolio" />
    <meta
      name="twitter:description"
      content="A portfolio of software and audio/DSP projects — what each one does, how it was built, and where to find the code."
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
