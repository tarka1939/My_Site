openapi: 3.0.3
info:
  title: My Site API
  description: |
    API contract for My Site's portfolio CMS (Project/Tag CRUD, contact form, admin auth).

    Scope: Phase 1-3 core endpoints, plus each Phase 7 extension endpoint as its sub-phase
    actually starts (see PROJECT_TODO.md). Phase 7a's GitHub webhook receiver is now in; the
    agent log, analytics and DSP demo endpoints are still out -- those entities remain marked
    draft/unconfirmed in docs/DATA_MODEL.md and get their own OpenAPI additions when their
    sub-phase begins.

    Conventions:
    - All endpoints are namespaced under /api/v1.
    - Not every path in this file is called by a browser. POST /webhooks/github is inbound-only:
      GitHub calls it, this API's own frontend never does, and it authenticates by an HMAC-SHA256
      signature over the raw request body rather than by a bearer token. It is documented here
      because this file is the record of every HTTP endpoint the backend serves, not only the
      subset the SPA calls -- see that operation's description for the reasoning.
    - Errors use RFC 7807 Problem Details (application/problem+json), matching Spring Boot 3's
      native ProblemDetail support -- see the ProblemDetail and ValidationProblemDetail schemas.
    - List endpoints return a page wrapper (content/page/size/totalElements/totalPages), not
      Spring Data's raw Page<T> serialization.
    - Multiple `tag` query params on GET /projects are OR'd together (any matching tag), not AND'd.
    - Projects have a `published` flag, and the public reads (GET /projects, GET /projects/{id},
      GET /tags) return published projects only -- unconditionally, with no parameter or credential
      that widens them. Drafts are read through the separate admin operations under /admin/projects.
      An unpublished project answers 404 publicly, not 403; see GET /projects/{id}.
    - Write endpoints (POST/PUT/DELETE on projects, contact-message reads/deletes) require a
      bearer JWT obtained from POST /auth/login (1 hour expiry, no refresh endpoint). There is no
      self-service registration endpoint -- the single AdminUser row is provisioned via a Flyway
      seed migration, not the API. Forgotten passwords go through POST /auth/password-reset-request
      and POST /auth/password-reset (reset email sent via a transactional email API, not SMTP).
  version: 1.0.0
  contact:
    name: My Site
    url: https://github.com/tarka1939/My_Site
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://TBD-vps-host/api/v1
    description: Production (VPS provider not yet chosen -- see docs/DECISIONS.md)

tags:
  - name: Projects
    description: Public project portfolio + admin-gated writes
  - name: Tags
    description: Read-only listing of the tags currently in use (tags are created implicitly via project writes)
  - name: Contact
    description: Public contact form submission + admin-gated message management
  - name: Auth
    description: Admin login
  - name: Webhooks
    description: |
      Inbound deliveries from third-party systems. Not called by this API's frontend, and not
      bearer-authenticated -- each operation documents its own verification scheme.

paths:
  /projects:
    get:
      operationId: listProjects
      summary: List published projects
      description: |
        Public, paginated, optionally filtered by tag (OR semantics across repeated `tag` params).

        **Published projects only.** A project with `published: false` is a draft -- either created
        automatically from a GitHub webhook delivery (see POST /webhooks/github) or un-published by
        the admin -- and never appears here, whatever credentials the caller presents. The filter is
        unconditional rather than relaxed for an authenticated admin, so there is no caller state,
        parameter or header in which this operation can return a draft. Admins list everything
        through GET /admin/projects instead.
      tags: [Projects]
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: tag
          in: query
          description: Filter to projects having any of the given tag names. Repeat the param for multiple tags (OR'd together).
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPageResponse'
    post:
      operationId: createProject
      summary: Create a project
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Get a published project by id
      description: |
        Public. **Published projects only**: an unpublished draft answers 404, identically to an id
        that names nothing at all.

        That is deliberate, not an approximation. A 403 would be the more literal description of
        what happened, and it is the wrong answer here, because it confirms that the id names a
        real project -- which is the single fact a draft exists to withhold. Drafts are auto-created
        from repositories the owner pushes to, including private ones, so "this id is real but not
        yours to see" is exactly the leak to avoid. Admins read drafts through
        GET /admin/projects/{id}.
      tags: [Projects]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateProject
      summary: Replace a project (full update)
      description: |
        Admin-authenticated, so unlike GET /projects/{id} on this same path, this operation reaches
        a project **regardless of its `published` state**, drafts included -- there is no separate
        "admin update" path the way reads split into GET /projects/{id} vs. GET /admin/projects/{id}.

        That asymmetry is deliberate, not an oversight carried over from before drafts existed.
        Publishing a draft works by PUT-ing `published: true` to it -- see the `published` field on
        ProjectWriteRequest -- which is only possible if this operation can reach a draft in the
        first place. A 404 here means the id names no project at all, published or not.
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteProject
      summary: Delete a project
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/projects:
    get:
      operationId: listAllProjects
      summary: List every project, drafts included (admin)
      description: |
        The admin counterpart to GET /projects: same paging, same tag filtering, same response
        schema, but no `published` filter, so unpublished drafts are included and can be told apart
        by the `published` field.

        A separate path rather than a flag on the public listing, on purpose. The public operation
        then has no parameter, header or credential that could widen what it returns -- the query
        behind it names `published = true` unconditionally -- so a draft leaking publicly cannot be
        caused by a mistake in deciding who the caller is. The cost is one more operation; the
        alternative puts the site's most public surface one boolean away from exposing the owner's
        private repositories.
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: tag
          in: query
          description: Filter to projects having any of the given tag names. Repeat the param for multiple tags (OR'd together).
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Paginated list of projects, published and unpublished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAnyProject
      summary: Get any project by id, draft or published (admin)
      description: |
        The admin counterpart to GET /projects/{id}, and the only way to read a draft -- which is
        what the admin UI needs before it can offer a publish control. 404 here means the id really
        does not exist, since nothing is filtered out.
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tags:
    get:
      operationId: listTags
      summary: List the tags currently attached to at least one published project
      description: >-
        Read-only. Returns **only** tags attached to at least one **published** project, ordered by
        name ascending. This endpoint exists to populate the public "filter by tag" control, and
        offering a filter value that matches nothing is a dead end -- selecting it would
        return an empty project list on the site's front page.


        The "published" half of that is Phase 7a's doing and follows from GET /projects filtering
        to published: a tag reachable only through an unpublished draft is exactly the dead-end
        filter value described above, and it additionally tells a visitor something about work
        that is not on the site yet. This is the same defect as the E2E-scaffolding tag that
        once reached the public filter, arriving by a new route.


        Consequently the listing is derived, not stored: a tag drops out as soon as its last
        project is deleted (or stops referencing it), and comes back if a later project
        re-attaches the same name. Orphaned `tag` rows are deliberately *not* deleted when
        their last reference goes -- that would be a check-then-act write on state a
        concurrent project write may be attaching to at the same moment -- so the filtering
        happens here, on read. Stale rows in the table are invisible through the API.


        Tags are created implicitly (upserted by name) when attached to a project via
        POST/PUT /projects -- there is no POST /tags.
      tags: [Tags]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'

  /contact:
    post:
      operationId: submitContactMessage
      summary: Submit a contact form message
      description: Public. Rate-limited per requester IP hash -- see docs/DATA_MODEL.md ContactMessage notes.
      tags: [Contact]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageWriteRequest'
      responses:
        '201':
          description: Message received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessageAck'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /contact-messages:
    get:
      operationId: listContactMessages
      summary: List submitted contact messages
      description: Admin only.
      tags: [Contact]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated list of contact messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessagePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contact-messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getContactMessage
      summary: Get a contact message by id
      description: Admin only.
      tags: [Contact]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteContactMessage
      summary: Delete a contact message
      description: Admin only.
      tags: [Contact]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/login:
    post:
      operationId: login
      summary: Admin login
      description: Issues a JWT for the single AdminUser account, valid for 1 hour. No refresh-token endpoint -- re-login once the token expires.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/password-reset-request:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: |
        Public. Always returns 202 regardless of whether the email matches an AdminUser account,
        to avoid leaking account existence (email enumeration). If it matches, a single-use reset
        token is generated (30 minute expiry) and emailed via a transactional email API (Resend).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestBody'
      responses:
        '202':
          description: Accepted -- a reset email was sent if the address matched an account
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/password-reset:
    post:
      operationId: confirmPasswordReset
      summary: Complete a password reset using a token from the reset email
      description: Public. Token must be unexpired and unused; consumed (used_at set) on success.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmBody'
      responses:
        '200':
          description: Password updated
        '400':
          description: Invalid, expired, or already-used token, or a validation failure on the new password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'

  /webhooks/github:
    post:
      operationId: receiveGithubWebhook
      summary: Receive a GitHub webhook delivery
      description: |
        Inbound-only, called by GitHub's webhook infrastructure. No browser client calls this,
        and it takes no bearer token -- it is documented here anyway because this file is the
        contract for every HTTP endpoint the backend serves, and this is the one endpoint whose
        exact header names, verification scheme and status codes most need writing down, since
        the caller is a third party that cannot be asked to adapt.

        **Verification.** GitHub computes HMAC-SHA256 over the *exact raw bytes* of the request
        body using the shared webhook secret and sends the result as
        `X-Hub-Signature-256: sha256=<hex>`. The receiver verifies that signature over the
        untouched bytes before parsing anything. A missing, malformed, or non-matching signature
        is a 401 and nothing is recorded. Re-serialising a parsed body would change the bytes
        (whitespace and key order), so the signed representation is the only one that can be
        verified -- do not assume a semantically-equal payload will verify.

        **Idempotency.** Deliveries are unique on `X-GitHub-Delivery`, and GitHub redelivers --
        manually from the repository's webhook settings, and automatically after some failures.
        A redelivered id is recorded exactly once: the replay answers 202 with
        `status: duplicate` and publishes no domain event.

        **Feature flag.** Disabled by default. While `app.github-sync.enabled` is false this path
        is not mapped at all and answers 404, per CLAUDE.md's config-based flags for Phase 7
        extensions. When it is true, an unset webhook secret is a startup failure rather than a
        running receiver that cannot verify anything.

        **What a delivery changes.** A `push` or `release` for a repository on the sync allowlist
        writes exactly three fields on the matching Project -- `lastPushedAt`, `defaultBranch` and
        `archived` -- matching case-insensitively on `repoFullName`. Nothing else is touched:
        `title`, `description`, `tags`, `links`, `images`, `startedOn` and `completedOn` are the
        owner's, and copying a repository description over hand-written prose would destroy
        content. If no project claims the repository, a new one is created **unpublished**, with
        placeholder title and description for the owner to write, so an inbound delivery can never
        put an entry on the live site. Any other event type, and any repository not on the
        allowlist, is recorded in the delivery ledger and changes no project at all.

        **Allowlist, not denylist.** `app.github-sync.synced-repositories` names the repositories a
        delivery may write, as a comma-separated list of `owner/name`. Empty -- the default --
        means no delivery writes anything, so the failure mode of an unconfigured receiver is
        "does nothing" rather than "turns every repository the owner touches into a draft". The
        200/202 answer here says the delivery was recorded, not that a project changed.
      tags: [Webhooks]
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: |
            `sha256=` followed by the lowercase hex HMAC-SHA256 of the raw request body, keyed by
            the shared webhook secret. Absent or non-matching means 401.
          schema:
            type: string
            pattern: '^sha256=[0-9a-fA-F]{64}$'
            example: sha256=757107ea0eb2509fc211221cce984b8a37570b6d7586c22c46f4379c8b043e17
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: GitHub's unique id for this delivery. The idempotency key -- a repeat is recorded once.
          schema:
            type: string
            maxLength: 255
            example: 72d3162e-cc78-11e3-81ab-4c9367dc0958
        - name: X-GitHub-Event
          in: header
          required: true
          description: The event name, e.g. `push`, `release`, `ping`.
          schema:
            type: string
            maxLength: 100
            example: push
      requestBody:
        required: true
        description: |
          GitHub's event payload, whose shape varies by event type and is GitHub's contract rather
          than this API's -- deliberately not modelled field-by-field here. Phase 7a reads only
          `repository.full_name` (absent on some events, e.g. an organization-level `ping`) plus,
          for a `push` or `release`, `repository.pushed_at`, `repository.default_branch` and
          `repository.archived`. The rest is stored verbatim for debugging. Note `pushed_at` is
          Unix epoch seconds on a `push` payload and an ISO-8601 string elsewhere; both are
          accepted.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: |
            Delivery verified and recorded. Also the answer to a replay -- check `status` to tell
            a first delivery (`recorded`) from a duplicate (`duplicate`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubWebhookAck'
        '400':
          description: |
            A required GitHub header is missing or implausibly long for the value GitHub sends,
            or the verified body is not valid JSON. Length is checked rather than trusted: the
            recorded columns are bounded, and a value that overflows one should be a 400 the
            sender can see, not a 500 that GitHub retries forever.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: |
            The `X-Hub-Signature-256` header is missing, malformed, or does not match the body.
            No `WWW-Authenticate` challenge is sent: there is no HTTP auth scheme to challenge
            with, and GitHub's own webhook documentation names 401 for this case.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: The receiver is disabled (`app.github-sync.enabled` is false), so this path is not mapped.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '413':
          description: Body exceeds the receiver's 1 MiB cap. Unauthenticated endpoint -- the cap is applied before the signature is checked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: |
            Content type is not `application/json`. GitHub webhooks can be configured to send
            `application/x-www-form-urlencoded` instead; that is rejected loudly rather than
            recorded as garbage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      description: Zero-indexed page number
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      description: Page size
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'
    Conflict:
      description: The request collides with another resource -- currently only a repoFullName another project already claims
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    RateLimited:
      description: Too many requests from this requester
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    Link:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
          example: GitHub
        url:
          type: string
          format: uri
          maxLength: 500
          example: https://github.com/tarka1939/Equalizer

    Tag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: react

    Project:
      type: object
      required: [id, title, description, links, images, tags, startedOn, completedOn, published, repoFullName, lastPushedAt, defaultBranch, archived, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 5000
        links:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Link'
        images:
          type: array
          maxItems: 20
          items:
            type: string
            format: uri
            maxLength: 500
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        startedOn:
          type: string
          format: date
          nullable: true
          description: |
            When work on the project started. Null means unspecified.

            Distinct from createdAt, which records when the row was entered. Stored at day
            precision but only ever rendered as month/year -- the underlying source material
            does not support day-level accuracy, so clients should not present one. The
            convention is the 1st of the month.
          example: '2024-03-01'
        completedOn:
          type: string
          format: date
          nullable: true
          description: |
            When work finished. **Null means the project is ongoing**, which is a meaningful
            value here, not merely missing data. Must not precede startedOn.
          example: '2025-06-01'
        published:
          type: boolean
          description: |
            Whether the project appears on the public site. Always true in anything the public
            endpoints return -- they cannot return anything else -- so the field carries information
            only on GET /admin/projects, where drafts are visible and need marking as such.
          example: true
        repoFullName:
          type: string
          nullable: true
          maxLength: 255
          description: |
            The GitHub repository this project tracks, as `owner/name`. Null for projects with no
            repository and for everything created before Phase 7a.

            This is what an inbound webhook delivery matches on, case-insensitively. A delivery for
            a repository no project claims creates a new **unpublished** project rather than
            touching an existing one.
          example: tarka1939/Equalizer
        lastPushedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the linked repository was last pushed to, according to GitHub. Null until a
            delivery for that repository arrives.

            One of exactly three GitHub-authoritative fields -- with `defaultBranch` and `archived`
            -- that an inbound webhook may write. Everything else on a Project is curated by the
            owner and is never written by sync; see POST /webhooks/github.
        defaultBranch:
          type: string
          nullable: true
          maxLength: 255
          description: The linked repository's default branch, according to GitHub. GitHub-authoritative -- see `lastPushedAt`.
          example: main
        archived:
          type: boolean
          description: |
            Whether the linked repository is archived on GitHub. GitHub-authoritative -- see
            `lastPushedAt`. False for a project with no linked repository. Stored and exposed, but
            nothing renders it yet.
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: |
            When the row last changed. A webhook sync writing `lastPushedAt`/`defaultBranch`/
            `archived` does change the row, so it bumps this too -- this timestamp tracks the
            record, not the owner's editing.

    ProjectWriteRequest:
      type: object
      description: |
        Body for both create (POST) and full update (PUT). Tags are given as names -- unknown
        names are created (upserted), not rejected.

        startedOn/completedOn are both optional and both nullable. Because this body is also used
        for full replacement (PUT), omitting either field clears it -- it does not preserve the
        stored value.

        `published` and `repoFullName` are the two exceptions to that rule, and the exception is
        deliberate -- see each field.
      required: [title, description, tags]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 5000
        links:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Link'
          default: []
        images:
          type: array
          maxItems: 20
          items:
            type: string
            format: uri
            maxLength: 500
          default: []
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          description: Tag names. Matched case-insensitively against existing tags; new names create a new Tag row.
        startedOn:
          type: string
          format: date
          nullable: true
          description: When work started. Optional; null or omitted means unspecified. Only ever rendered as month/year -- see the Project schema.
          example: '2024-03-01'
        completedOn:
          type: string
          format: date
          nullable: true
          description: |
            When work finished. Null or omitted means **ongoing**. Rejected with 400 if it
            precedes startedOn, or if it is supplied while startedOn is not -- a project cannot
            finish without having started.
          example: '2025-06-01'
        published:
          type: boolean
          nullable: true
          description: |
            Whether the project appears on the public site.

            **Omitted or null means "leave it as it is"** -- the one exception, with `repoFullName`,
            to this body's otherwise-full-replacement semantics. The exception is deliberate: this
            field did not exist before Phase 7a, so a PUT from a client that predates it carries no
            statement about publication at all, and reading that silence as `false` would
            un-publish a live project on its next edit. That is the same "the site goes blank"
            failure the Phase 7a migration guards against, reached through the API instead.

            On create, omitted means **true**: a project entered by hand through the CMS is meant to
            be live, which is what POST has always done. Un-publishing therefore takes an explicit
            `false`.
          example: true
        repoFullName:
          type: string
          nullable: true
          maxLength: 255
          pattern: '^[^\s/]+/[^\s/]+$'
          description: |
            Link this project to a GitHub repository, as `owner/name`, so that webhook deliveries
            for that repository update it instead of creating a separate draft. Unique across
            projects, compared case-insensitively; a name another project already claims is
            rejected with 409.

            **Omitted or null means "leave it as it is"**, for the same reason as `published`: an
            older client's PUT is not a request to unlink. Clearing an existing link is
            consequently not possible through this endpoint in Phase 7a.
          example: tarka1939/Equalizer

    ProjectPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Project'

