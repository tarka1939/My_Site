openapi: 3.0.3
info:
  title: My Site API
  description: |
    API contract for My Site's portfolio CMS (Project/Tag CRUD, contact form, admin auth).

    Scope: Phase 1-3 core endpoints, plus each Phase 7 extension endpoint as its sub-phase
    actually starts (see PROJECT_TODO.md). Phase 7a's GitHub webhook receiver is now in; the
    agent log, analytics and DSP demo endpoints are still out -- those entities remain marked
    draft/unconfirmed in docs/DATA_MODEL.md and get their own OpenAPI additions when their
    sub-phase begins.

    Conventions:
    - All endpoints are namespaced under /api/v1.
    - Not every path in this file is called by a browser. POST /webhooks/github is inbound-only:
      GitHub calls it, this API's own frontend never does, and it authenticates by an HMAC-SHA256
      signature over the raw request body rather than by a bearer token. It is documented here
      because this file is the record of every HTTP endpoint the backend serves, not only the
      subset the SPA calls -- see that operation's description for the reasoning.
    - Errors use RFC 7807 Problem Details (application/problem+json), matching Spring Boot 3's
      native ProblemDetail support -- see the ProblemDetail and ValidationProblemDetail schemas.
    - List endpoints return a page wrapper (content/page/size/totalElements/totalPages), not
      Spring Data's raw Page<T> serialization.
    - Multiple `tag` query params on GET /projects are OR'd together (any matching tag), not AND'd.
    - Write endpoints (POST/PUT/DELETE on projects, contact-message reads/deletes) require a
      bearer JWT obtained from POST /auth/login (1 hour expiry, no refresh endpoint). There is no
      self-service registration endpoint -- the single AdminUser row is provisioned via a Flyway
      seed migration, not the API. Forgotten passwords go through POST /auth/password-reset-request
      and POST /auth/password-reset (reset email sent via a transactional email API, not SMTP).
  version: 1.0.0
  contact:
    name: My Site
    url: https://github.com/tarka1939/My_Site
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://TBD-vps-host/api/v1
    description: Production (VPS provider not yet chosen -- see docs/DECISIONS.md)

tags:
  - name: Projects
    description: Public project portfolio + admin-gated writes
  - name: Tags
    description: Read-only listing of the tags currently in use (tags are created implicitly via project writes)
  - name: Contact
    description: Public contact form submission + admin-gated message management
  - name: Auth
    description: Admin login
  - name: Webhooks
    description: |
      Inbound deliveries from third-party systems. Not called by this API's frontend, and not
      bearer-authenticated -- each operation documents its own verification scheme.

paths:
  /projects:
    get:
      operationId: listProjects
      summary: List projects
      description: Public, paginated, optionally filtered by tag (OR semantics across repeated `tag` params).
      tags: [Projects]
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: tag
          in: query
          description: Filter to projects having any of the given tag names. Repeat the param for multiple tags (OR'd together).
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPageResponse'
    post:
      operationId: createProject
      summary: Create a project
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Get a project by id
      tags: [Projects]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateProject
      summary: Replace a project (full update)
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteProject
      summary: Delete a project
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tags:
    get:
      operationId: listTags
      summary: List the tags currently attached to at least one project
      description: >-
        Read-only. Returns **only** tags attached to at least one project, ordered by name
        ascending. This endpoint exists to populate the public "filter by tag" control, and
        offering a filter value that matches nothing is a dead end -- selecting it would
        return an empty project list on the site's front page.


        Consequently the listing is derived, not stored: a tag drops out as soon as its last
        project is deleted (or stops referencing it), and comes back if a later project
        re-attaches the same name. Orphaned `tag` rows are deliberately *not* deleted when
        their last reference goes -- that would be a check-then-act write on state a
        concurrent project write may be attaching to at the same moment -- so the filtering
        happens here, on read. Stale rows in the table are invisible through the API.


        Tags are created implicitly (upserted by name) when attached to a project via
        POST/PUT /projects -- there is no POST /tags.
      tags: [Tags]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'

  /contact:
    post:
      operationId: submitContactMessage
      summary: Submit a contact form message
      description: Public. Rate-limited per requester IP hash -- see docs/DATA_MODEL.md ContactMessage notes.
      tags: [Contact]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageWriteRequest'
      responses:
        '201':
          description: Message received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessageAck'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /contact-messages:
    get:
      operationId: listContactMessages
      summary: List submitted contact messages
      description: Admin only.
      tags: [Contact]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated list of contact messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessagePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contact-messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getContactMessage
      summary: Get a contact message by id
      description: Admin only.
      tags: [Contact]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteContactMessage
      summary: Delete a contact message
      description: Admin only.
      tags: [Contact]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/login:
    post:
      operationId: login
      summary: Admin login
      description: Issues a JWT for the single AdminUser account, valid for 1 hour. No refresh-token endpoint -- re-login once the token expires.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/password-reset-request:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: |
        Public. Always returns 202 regardless of whether the email matches an AdminUser account,
        to avoid leaking account existence (email enumeration). If it matches, a single-use reset
        token is generated (30 minute expiry) and emailed via a transactional email API (Resend).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestBody'
      responses:
        '202':
          description: Accepted -- a reset email was sent if the address matched an account
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/password-reset:
    post:
      operationId: confirmPasswordReset
      summary: Complete a password reset using a token from the reset email
      description: Public. Token must be unexpired and unused; consumed (used_at set) on success.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmBody'
      responses:
        '200':
          description: Password updated
        '400':
          description: Invalid, expired, or already-used token, or a validation failure on the new password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'

  /webhooks/github:
    post:
      operationId: receiveGithubWebhook
      summary: Receive a GitHub webhook delivery
      description: |
        Inbound-only, called by GitHub's webhook infrastructure. No browser client calls this,
        and it takes no bearer token -- it is documented here anyway because this file is the
        contract for every HTTP endpoint the backend serves, and this is the one endpoint whose
        exact header names, verification scheme and status codes most need writing down, since
        the caller is a third party that cannot be asked to adapt.

        **Verification.** GitHub computes HMAC-SHA256 over the *exact raw bytes* of the request
        body using the shared webhook secret and sends the result as
        `X-Hub-Signature-256: sha256=<hex>`. The receiver verifies that signature over the
        untouched bytes before parsing anything. A missing, malformed, or non-matching signature
        is a 401 and nothing is recorded. Re-serialising a parsed body would change the bytes
        (whitespace and key order), so the signed representation is the only one that can be
        verified -- do not assume a semantically-equal payload will verify.

        **Idempotency.** Deliveries are unique on `X-GitHub-Delivery`, and GitHub redelivers --
        manually from the repository's webhook settings, and automatically after some failures.
        A redelivered id is recorded exactly once: the replay answers 202 with
        `status: duplicate` and publishes no domain event.

        **Feature flag.** Disabled by default. While `app.github-sync.enabled` is false this path
        is not mapped at all and answers 404, per CLAUDE.md's config-based flags for Phase 7
        extensions. When it is true, an unset webhook secret is a startup failure rather than a
        running receiver that cannot verify anything.

        **Scope.** Phase 7a is the receiver only: verify, record, publish a
        `GithubDeliveryReceivedEvent`, stop. What a verified delivery should change on a Project
        is issue #54 and is deliberately not implemented -- the portfolio's prose is
        hand-curated, so copying a repository description over it would destroy content.
      tags: [Webhooks]
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: |
            `sha256=` followed by the lowercase hex HMAC-SHA256 of the raw request body, keyed by
            the shared webhook secret. Absent or non-matching means 401.
          schema:
            type: string
            pattern: '^sha256=[0-9a-fA-F]{64}$'
            example: sha256=757107ea0eb2509fc211221cce984b8a37570b6d7586c22c46f4379c8b043e17
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: GitHub's unique id for this delivery. The idempotency key -- a repeat is recorded once.
          schema:
            type: string
            maxLength: 255
            example: 72d3162e-cc78-11e3-81ab-4c9367dc0958
        - name: X-GitHub-Event
          in: header
          required: true
          description: The event name, e.g. `push`, `release`, `ping`.
          schema:
            type: string
            maxLength: 100
            example: push
      requestBody:
        required: true
        description: |
          GitHub's event payload, whose shape varies by event type and is GitHub's contract rather
          than this API's -- deliberately not modelled field-by-field here. Phase 7a reads only
          `repository.full_name` (absent on some events, e.g. an organization-level `ping`) and
          stores the rest verbatim for debugging.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: |
            Delivery verified and recorded. Also the answer to a replay -- check `status` to tell
            a first delivery (`recorded`) from a duplicate (`duplicate`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubWebhookAck'
        '400':
          description: A required GitHub header is missing, or the verified body is not valid JSON.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: |
            The `X-Hub-Signature-256` header is missing, malformed, or does not match the body.
            No `WWW-Authenticate` challenge is sent: there is no HTTP auth scheme to challenge
            with, and GitHub's own webhook documentation names 401 for this case.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: The receiver is disabled (`app.github-sync.enabled` is false), so this path is not mapped.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '413':
          description: Body exceeds the receiver's 1 MiB cap. Unauthenticated endpoint -- the cap is applied before the signature is checked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: |
            Content type is not `application/json`. GitHub webhooks can be configured to send
            `application/x-www-form-urlencoded` instead; that is rejected loudly rather than
            recorded as garbage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      description: Zero-indexed page number
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      description: Page size
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: Request failed validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'
    RateLimited:
      description: Too many requests from this requester
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    Link:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
          example: GitHub
        url:
          type: string
          format: uri
          maxLength: 500
          example: https://github.com/tarka1939/Equalizer

    Tag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: react

    Project:
      type: object
      required: [id, title, description, links, images, tags, startedOn, completedOn, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 5000
        links:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Link'
        images:
          type: array
          maxItems: 20
          items:
            type: string
            format: uri
            maxLength: 500
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        startedOn:
          type: string
          format: date
          nullable: true
          description: |
            When work on the project started. Null means unspecified.

            Distinct from createdAt, which records when the row was entered. Stored at day
            precision but only ever rendered as month/year -- the underlying source material
            does not support day-level accuracy, so clients should not present one. The
            convention is the 1st of the month.
          example: '2024-03-01'
        completedOn:
          type: string
          format: date
          nullable: true
          description: |
            When work finished. **Null means the project is ongoing**, which is a meaningful
            value here, not merely missing data. Must not precede startedOn.
          example: '2025-06-01'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectWriteRequest:
      type: object
      description: |
        Body for both create (POST) and full update (PUT). Tags are given as names -- unknown
        names are created (upserted), not rejected.

        startedOn/completedOn are both optional and both nullable. Because this body is also used
        for full replacement (PUT), omitting either field clears it -- it does not preserve the
        stored value.
      required: [title, description, tags]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 5000
        links:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Link'
          default: []
        images:
          type: array
          maxItems: 20
          items:
            type: string
            format: uri
            maxLength: 500
          default: []
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          description: Tag names. Matched case-insensitively against existing tags; new names create a new Tag row.
        startedOn:
          type: string
          format: date
          nullable: true
          description: When work started. Optional; null or omitted means unspecified. Only ever rendered as month/year -- see the Project schema.
          example: '2024-03-01'
        completedOn:
          type: string
          format: date
          nullable: true
          description: |
            When work finished. Null or omitted means **ongoing**. Rejected with 400 if it
            precedes startedOn, or if it is supplied while startedOn is not -- a project cannot
            finish without having started.
          example: '2025-06-01'

    ProjectPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Project'

    ContactMessage:
      type: object
      required: [id, name, email, message, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        message:
          type: string
          maxLength: 5000
        createdAt:
          type: string
          format: date-time

    ContactMessageWriteRequest:
      type: object
      required: [name, email, message]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        message:
          type: string
          minLength: 1
          maxLength: 5000

    ContactMessageAck:
      type: object
      description: Deliberately minimal -- does not echo the stored message back, just confirms receipt.
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ContactMessagePageResponse:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ContactMessage'

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password

    LoginResponse:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: "JWT bearer token -- pass as `Authorization: Bearer <token>` on subsequent requests."
        expiresAt:
          type: string
          format: date-time

    PasswordResetRequestBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    PasswordResetConfirmBody:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: The raw reset token from the emailed link (compared against the stored hash server-side).
        newPassword:
          type: string
          format: password
          minLength: 8

    GithubWebhookAck:
      type: object
      description: Acknowledgement for a verified GitHub webhook delivery.
      required: [deliveryId, status]
      properties:
        deliveryId:
          type: string
          description: Echo of the `X-GitHub-Delivery` header, so a redelivery can be correlated in logs.
          example: 72d3162e-cc78-11e3-81ab-4c9367dc0958
        status:
          type: string
          enum: [recorded, duplicate]
          description: |
            `recorded` -- first time this delivery id was seen; it was stored and a
            `GithubDeliveryReceivedEvent` was published.
            `duplicate` -- this delivery id already existed; nothing was stored and no event was
            published. Both are 202, because from GitHub's side both mean "received, stop retrying".
          example: recorded

    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details, as returned natively by Spring Boot 3's ProblemDetail / @ControllerAdvice.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

    ValidationProblemDetail:
      description: ProblemDetail extended with per-field violations.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    description: |
                      Which input the violation is about, as a path. Clients key their inline
                      messages off this, so the exact spelling is part of the contract.

                      **Request body violations** (the common case) use the property's path within
                      the body: a top-level property is its bare name (`title`, `completedOn`), a
                      violation inside a collection carries the element's zero-based index in
                      brackets (`images[0]`, `tags[2]`), and a nested property appends a dotted
                      segment after the index (`links[0].label`, `links[0].url`).

                      **Query and path parameter violations** are *not* body paths -- they are
                      prefixed with the operation's handler name, as in `listProjects.size` for
                      `GET /projects?size=101`. Match these literally; do not try to read the part
                      before the dot as a body property.

                      A single request can report several violations, and the same `field` may
                      appear more than once when one input breaks more than one rule, so treat
                      `errors` as a list per field rather than a map.

                      Do not assume the set of possible values is closed: a field with no slot in
                      the UI still needs its message shown somewhere rather than dropped.
                    example: links[0].label
                  message:
                    type: string
