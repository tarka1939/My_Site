spring:
  application:
    name: mysite-backend
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  # No default here for app.jwt.secret on purpose -- it's set per-profile (dev has a
  # convenience fallback, prod/test require JWT_SECRET explicitly) so that running with no
  # active profile fails fast instead of silently picking up an insecure default. Same
  # discipline as the Phase 1 SecurityConfig fail-open fix -- see AGENT_LOG.md.
  github-sync:
    # Phase 7a's GitHub webhook receiver, and the flag pattern for Phase 7 extensions generally
    # (CLAUDE.md: extensions ship behind config flags so the core CMS can ship while they are
    # half-built). Off here, in the base config, so every profile -- including no profile at
    # all -- inherits the closed default; turn it on per environment with GITHUB_SYNC_ENABLED.
    # While off, no receiver bean is created and the endpoint 404s: there is no code path that
    # could accept an unverified payload, rather than a path guarded by a check.
    enabled: ${GITHUB_SYNC_ENABLED:false}
    # Empty default, and NOT the same call as app.jwt.secret's deliberate absence of one.
    # Enabling the receiver is an explicit opt-in, and it is that opt-in that makes the secret
    # required: with enabled=true and this blank, GithubSignatureVerifier's constructor throws
    # and the application refuses to start (see GithubSyncConfiguration). With enabled=false --
    # the default -- a blank secret is simply irrelevant, because nothing reads it and there is
    # nothing to verify. Fail fast on wrong, not on unused.
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    # The repositories a verified delivery may create or update a Project for, comma-separated as
    # owner/name. An ALLOWLIST, not a denylist, and empty by default -- so a receiver switched on
    # before anyone has said which repositories matter records deliveries and writes nothing,
    # rather than turning every repository the owner pushes to, private ones included, into a row
    # in the CMS. An empty denylist would do the opposite. Reasoning in full on GithubSyncPolicy.
    #
    # Absent is fine and means "sync nothing" -- a designed no-op, like RESEND_API_KEY's absence.
    # An entry that is present but is not owner/name fails startup instead, because it could
    # never match a delivery and would silently mean a repository the owner believes is synced
    # is not. Fail fast on wrong, degrade on unused.
    synced-repositories: ${GITHUB_SYNC_REPOSITORIES:}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-address: ${RESEND_FROM_ADDRESS:onboarding@resend.dev}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
