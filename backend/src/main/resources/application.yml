spring:
  application:
    name: mysite-backend
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  # No default here for app.jwt.secret on purpose -- it's set per-profile (dev has a
  # convenience fallback, prod/test require JWT_SECRET explicitly) so that running with no
  # active profile fails fast instead of silently picking up an insecure default. Same
  # discipline as the Phase 1 SecurityConfig fail-open fix -- see AGENT_LOG.md.
  github-sync:
    # Phase 7a's GitHub webhook receiver, and the flag pattern for Phase 7 extensions generally
    # (CLAUDE.md: extensions ship behind config flags so the core CMS can ship while they are
    # half-built). Off here, in the base config, so every profile -- including no profile at
    # all -- inherits the closed default; turn it on per environment with GITHUB_SYNC_ENABLED.
    # While off, no receiver bean is created and the endpoint 404s: there is no code path that
    # could accept an unverified payload, rather than a path guarded by a check.
    enabled: ${GITHUB_SYNC_ENABLED:false}
    # Empty default, and NOT the same call as app.jwt.secret's deliberate absence of one.
    # Enabling the receiver is an explicit opt-in, and it is that opt-in that makes the secret
    # required: with enabled=true and this blank, GithubSignatureVerifier's constructor throws
    # and the application refuses to start (see GithubSyncConfiguration). With enabled=false --
    # the default -- a blank secret is simply irrelevant, because nothing reads it and there is
    # nothing to verify. Fail fast on wrong, not on unused.
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    # The repositories a verified delivery may create or update a Project for, comma-separated as
    # owner/name. An ALLOWLIST, not a denylist, and empty by default -- so a receiver switched on
    # before anyone has said which repositories matter records deliveries and writes nothing,
    # rather than turning every repository the owner pushes to, private ones included, into a row
    # in the CMS. An empty denylist would do the opposite. Reasoning in full on GithubSyncPolicy.
    #
    # Absent is fine and means "sync nothing" -- a designed no-op, like RESEND_API_KEY's absence.
    # An entry that is present but is not owner/name fails startup instead, because it could
    # never match a delivery and would silently mean a repository the owner believes is synced
    # is not. Fail fast on wrong, degrade on unused.
    synced-repositories: ${GITHUB_SYNC_REPOSITORIES:}
  cors:
    # Issue #44. Exact origins, comma-separated -- no wildcards, and a wildcard entry fails
    # startup rather than being quietly honoured (SecurityConfig#parseAllowedOrigins). The
    # deployed Netlify origin is the default because it is deployment data rather than a secret,
    # and hardcoding it in Java would make the eventual custom-domain switchover a code change
    # instead of an env-var one; during that switchover both origins are listed here at once.
    # Netlify DEPLOY PREVIEWS are deliberately absent -- see the reasoning on the
    # corsConfigurationSource bean. Empty means "answer no cross-origin request", which is the
    # closed default and what dev gets in practice anyway, since ng serve proxies /api and so is
    # same-origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://krzysztof-tarka.netlify.app}
  forwarded-headers:
    # Issue #168. All three OFF here, in the base config, so any environment that has not said it
    # is behind a proxy -- dev, test, no profile at all -- keeps the pre-#168 behaviour of trusting
    # nothing but getRemoteAddr(). Trusting a forwarded header by default would be worse than the
    # bug it fixes: the header is caller-supplied, and a forged one with a fresh value per request
    # defeats per-IP rate limiting outright rather than merely globalising it.
    #
    # Absent is a designed no-op; present-but-wrong fails startup (a malformed CIDR, a negative
    # hop count, or a header/hop-count set with no trusted proxy to make it meaningful). Set for
    # real in application-prod.yml, where the proxies actually exist.
    trusted-proxies: ${TRUSTED_PROXIES:}
    client-ip-header: ${CLIENT_IP_HEADER:}
    trusted-hop-count: ${TRUSTED_HOP_COUNT:0}
  contact:
    # Issue #186. Where a new contact-form submission is announced. Before this existed the form
    # notified nobody and messages sat in the database until someone opened the admin panel.
    #
    # No default address, and deliberately not an RFC 2606 .invalid placeholder either -- a
    # placeholder that parses would make every environment attempt a send to a domain that cannot
    # receive, which looks like a delivery bug rather than "nobody configured this". Empty means
    # off: ContactNotificationListener warns and skips, and the visitor's message is still
    # persisted and still answered with 201. That is the designed no-op, the same call as
    # RESEND_API_KEY's absence below.
    #
    # Present but malformed is the other half and is NOT tolerated -- the listener's constructor
    # throws and the application refuses to start. A typo'd address would otherwise be invisible:
    # sends fail one at a time in a log nobody reads, and the owner concludes nobody is writing in.
    # Fail fast on wrong, degrade on unused.
    notification-email: ${CONTACT_NOTIFICATION_EMAIL:}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-address: ${RESEND_FROM_ADDRESS:onboarding@resend.dev}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
